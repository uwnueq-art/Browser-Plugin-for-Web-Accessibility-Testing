<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Vision Simulator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 380px;
      font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
      background: #fff;
      color: #1d1d1f;
    }

    /* Табы */
    .tabs {
      display: flex;
      border-bottom: 1px solid #f0f0f0;
    }
    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      color: #86868b;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
    }
    .tab:hover { color: #1d1d1f; }
    .tab.active { color: #0071e3; border-bottom-color: #0071e3; }

    /* Панели */
    .panel { display: none; padding: 16px 20px 20px; }
    .panel.active { display: block; }

    /* --- Панель симуляции --- */
    .group-title {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #86868b;
      margin-bottom: 8px;
    }
    .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      background: #f5f5f7;
      border: 1.5px solid #f5f5f7;
      color: #1d1d1f;
      transition: all 0.15s;
      user-select: none;
    }
    .pill:hover { background: #ededf0; border-color: #ededf0; }
    .pill.active { background: #e8f0fe; border-color: #b3d1f7; color: #0055b3; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    .wiki-row { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
    .wiki-row .pill { flex-grow: 1; }
    .wiki-link {
      display: flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; border-radius: 50%;
      background: #f5f5f7; color: #86868b;
      font-size: 10px; font-weight: 600; text-decoration: none;
      flex-shrink: 0; transition: all 0.15s;
      font-family: Georgia, serif; font-style: italic;
    }
    .wiki-link:hover { background: #0071e3; color: #fff; }

    .status-row {
      display: flex; align-items: center; justify-content: space-between;
      padding-top: 12px; border-top: 1px solid #f0f0f0; margin-top: 4px;
    }
    .status { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #86868b; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #d1d1d6; }
    .status-dot.on { background: #34c759; }
    .reset-btn {
      padding: 5px 12px; border: none; border-radius: 14px;
      background: #f5f5f7; color: #86868b; font-size: 11px;
      font-weight: 500; cursor: pointer; transition: all 0.15s;
    }
    .reset-btn:hover { background: #ededf0; color: #1d1d1f; }

    /* --- Панель проверки доступности --- */
    .audit-btn {
      width: 100%; padding: 10px; border: none; border-radius: 10px;
      background: #0071e3; color: #fff; font-size: 13px;
      font-weight: 600; cursor: pointer; transition: all 0.15s;
      margin-bottom: 14px;
    }
    .audit-btn:hover { background: #0062c4; }
    .audit-btn:disabled { background: #d1d1d6; cursor: default; }

    .audit-info {
      font-size: 11px; color: #86868b; margin-bottom: 14px; line-height: 1.5;
    }
    .audit-results { display: flex; flex-direction: column; gap: 8px; }

    .audit-card {
      padding: 10px 12px; border-radius: 10px;
      border-left: 3px solid #d1d1d6; background: #fafafa;
    }
    .audit-card.pass { border-left-color: #34c759; }
    .audit-card.warn { border-left-color: #ff9f0a; }
    .audit-card.fail { border-left-color: #ff3b30; }

    .audit-card-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 4px;
    }
    .audit-card-title { font-size: 12px; font-weight: 600; }
    .audit-badge {
      font-size: 10px; font-weight: 600; padding: 2px 8px;
      border-radius: 10px;
    }
    .audit-badge.pass { background: #e8f8ee; color: #1b7d3a; }
    .audit-badge.warn { background: #fff4e0; color: #9a6700; }
    .audit-badge.fail { background: #fee; color: #c33; }
    .audit-card-detail { font-size: 11px; color: #555; line-height: 1.5; }
    .audit-card-ref { font-size: 10px; color: #86868b; margin-top: 4px; }

    .audit-empty {
      text-align: center; padding: 20px;
      font-size: 12px; color: #86868b;
    }
    .audit-summary {
      display: flex; gap: 8px; margin-bottom: 12px;
    }
    .summary-box {
      flex: 1; text-align: center; padding: 10px 6px;
      border-radius: 8px; background: #f5f5f7;
    }
    .summary-num { font-size: 20px; font-weight: 600; }
    .summary-num.green { color: #34c759; }
    .summary-num.orange { color: #ff9f0a; }
    .summary-num.red { color: #ff3b30; }
    .summary-label { font-size: 10px; color: #86868b; margin-top: 2px; }
  </style>
</head>
<body>

  <!-- Табы -->
  <div class="tabs">
    <button class="tab active" data-tab="sim">Симуляция</button>
    <button class="tab" data-tab="audit">Проверка доступности</button>
  </div>

  <!-- Панель 1: Симуляция дальтонизма -->
  <div class="panel active" id="panel-sim">
    <div class="group-title">Нарушения цветовосприятия</div>
    <div class="pills">
      <div class="wiki-row">
        <div class="pill" data-mode="protanopia"><span class="dot" style="background:#ef4444"></span>Протанопия</div>
        <a class="wiki-link" href="https://ru.wikipedia.org/wiki/Протанопия" target="_blank" title="Википедия">W</a>
      </div>
      <div class="wiki-row">
        <div class="pill" data-mode="deuteranopia"><span class="dot" style="background:#22c55e"></span>Дейтеранопия</div>
        <a class="wiki-link" href="https://ru.wikipedia.org/wiki/Дейтеранопия" target="_blank" title="Википедия">W</a>
      </div>
      <div class="wiki-row">
        <div class="pill" data-mode="tritanopia"><span class="dot" style="background:#3b82f6"></span>Тританопия</div>
        <a class="wiki-link" href="https://ru.wikipedia.org/wiki/Тританопия" target="_blank" title="Википедия">W</a>
      </div>
      <div class="wiki-row">
        <div class="pill" data-mode="achromatopsia"><span class="dot" style="background:#9ca3af"></span>Ахроматопсия</div>
        <a class="wiki-link" href="https://ru.wikipedia.org/wiki/Ахроматопсия" target="_blank" title="Википедия">W</a>
      </div>
    </div>
    <div class="status-row">
      <div class="status">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Фильтр не активен</span>
      </div>
      <button class="reset-btn" id="resetBtn">Сбросить</button>
    </div>
  </div>

  <!-- Панель 2: Проверка доступности -->
  <div class="panel" id="panel-audit">
    <div class="audit-info">
      Проверка элементов страницы на соответствие рекомендациям ГОСТ Р 52872-2019 и WCAG 2.1 для слабовидящих пользователей.
    </div>
    <button class="audit-btn" id="auditBtn">Проверить текущую страницу</button>
    <div id="auditResults">
      <div class="audit-empty">Нажмите кнопку для запуска проверки</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
